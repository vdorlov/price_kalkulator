<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор медицинских услуг</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --med-blue:#0b4f8a;
    --med-blue-dark:#073863;
    --med-teal:#12a3a3;
    --med-light:#eaf4fb;
    --med-accent:#4fc3f7;
    --danger:#e74c3c;
    --shadow:0 6px 22px rgba(11,79,138,.12);
    --radius:14px;
    --row-h:62px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;color:#1c2b3a;background:#f4f8fc}
  body{
    background-image:
      radial-gradient(circle at 10% 0%, rgba(79,195,247,.15), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(18,163,163,.12), transparent 45%),
      linear-gradient(180deg,#f4f8fc 0%,#eaf4fb 100%);
    min-height:100vh;
  }

  header{
    background:linear-gradient(135deg,var(--med-blue) 0%, var(--med-blue-dark) 100%);
    color:#fff;padding:22px 40px;position:relative;overflow:hidden;
    box-shadow:var(--shadow);
  }
  header::after{
    content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;
    border-radius:50%;background:rgba(79,195,247,.18);
  }
  header h1{margin:0;font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:14px}
  header .cross{
    width:34px;height:34px;background:#fff;border-radius:9px;position:relative;flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(255,255,255,.25);
  }
  header .cross::before,header .cross::after{content:"";position:absolute;background:var(--med-blue);border-radius:2px}
  header .cross::before{width:7px;height:22px;left:13px;top:6px}
  header .cross::after{width:22px;height:7px;left:6px;top:13px}
  header p{margin:6px 0 0;opacity:.85;font-size:13px}

  .layout{
    display:grid;grid-template-columns:1.5fr 1fr;gap:20px;
    max-width:1500px;margin:20px auto;padding:0 20px;
  }
  @media(max-width:1050px){.layout{grid-template-columns:1fr}}

  .panel{
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;border:1px solid #dceaf5;
    display:flex;flex-direction:column;
    height:calc(100vh - 140px);min-height:520px;
  }
  .panel-head{
    background:linear-gradient(90deg,#f0f7fd,#ffffff);
    padding:14px 18px;border-bottom:1px solid #e2eef7;
    display:flex;align-items:center;gap:10px;justify-content:space-between;
    font-weight:600;color:var(--med-blue-dark);font-size:15px;flex:0 0 auto;
  }
  .panel-head .dot{
    width:10px;height:10px;border-radius:50%;background:var(--med-teal);
    box-shadow:0 0 0 4px rgba(18,163,163,.18);
  }
  .panel-head .left{display:flex;align-items:center;gap:10px}

  /* Фильтры */
  .filters{
    padding:12px 18px;background:#fbfdff;border-bottom:1px solid #e8f1f8;
    display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto;
  }
  .filters .search-box{grid-column:1 / -1;position:relative}
  .filters select{
    width:100%;padding:10px 12px;border:2px solid #d9e7f2;border-radius:10px;
    background:#fff;font-size:13.5px;outline:none;cursor:pointer;
    transition:.2s;color:#1c2b3a;
  }
  .filters select:focus{border-color:var(--med-accent);box-shadow:0 0 0 4px rgba(79,195,247,.15)}
  .search-box input{
    width:100%;padding:13px 90px 13px 44px;font-size:14.5px;
    border:2px solid #d9e7f2;border-radius:12px;outline:none;
    transition:.25s;background:#fbfdff;
  }
  .search-box input:focus{
    border-color:var(--med-accent);box-shadow:0 0 0 4px rgba(79,195,247,.18);background:#fff;
  }
  .search-box .icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--med-blue);opacity:.7;font-size:16px;pointer-events:none;
  }
  .search-box .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:none;background:#eaf4fb;color:var(--med-blue);
    width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;transition:.2s;
  }
  .search-box .clear:hover{background:var(--med-blue);color:#fff;transform:translateY(-50%) rotate(90deg)}
  .search-box .counter{
    position:absolute;right:42px;top:50%;transform:translateY(-50%);
    font-size:11.5px;color:#7d95aa;font-weight:600;background:#eef7fd;
    padding:3px 8px;border-radius:12px;pointer-events:none;
  }

  .meta{
    padding:8px 18px;font-size:12.5px;color:#678;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #eef7fd;flex:0 0 auto;
  }
  .chip{
    background:var(--med-light);color:var(--med-blue);padding:3px 10px;border-radius:20px;
    font-size:11.5px;font-weight:600;
  }
  .chip.teal{background:#e6fbf8;color:#0d8b8b}

  /* ============ ВИРТУАЛЬНЫЙ СПИСОК ============ */
  .vlist-wrap{
    flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;
    background:#fff;
  }
  .vlist-wrap::-webkit-scrollbar{width:10px}
  .vlist-wrap::-webkit-scrollbar-track{background:#f4f8fc}
  .vlist-wrap::-webkit-scrollbar-thumb{background:#c4dcef;border-radius:5px;border:2px solid #f4f8fc}
  .vlist-wrap::-webkit-scrollbar-thumb:hover{background:var(--med-accent)}

  .vlist-spacer{position:relative;width:100%}

  .service{
    position:absolute;left:0;right:0;
    display:flex;align-items:flex-start;gap:12px;
    padding:10px 18px;height:var(--row-h);
    border-bottom:1px solid #f0f6fb;background:#fff;cursor:pointer;
    transition:background .18s, box-shadow .18s;
    will-change:transform;
    overflow:hidden;
  }
  .service:hover{
    background:linear-gradient(90deg,#f7fcff,#ffffff);
    box-shadow:inset 4px 0 0 var(--med-accent);
    z-index:2;
  }
  .service.selected{
    background:linear-gradient(90deg,#e9fbf8,#ffffff);
    box-shadow:inset 4px 0 0 var(--med-teal);
  }
  .service input[type=checkbox]{
    appearance:none;width:20px;height:20px;flex:0 0 auto;margin-top:3px;
    border:2px solid #b9d3e6;border-radius:6px;cursor:pointer;position:relative;
    transition:.2s;background:#fff;
  }
  .service:hover input[type=checkbox]{border-color:var(--med-accent)}
  .service input[type=checkbox]:checked{
    background:var(--med-teal);border-color:var(--med-teal);
  }
  .service input[type=checkbox]:checked::after{
    content:"✓";position:absolute;color:#fff;font-size:14px;font-weight:bold;
    left:2px;top:-3px;
  }
  .service-body{flex:1;min-width:0;overflow:hidden}
  .service-name{
    font-size:13.5px;line-height:1.3;color:#1c2b3a;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:ellipsis;
  }
  .service-code{font-size:10.5px;color:#8aa2b8;font-family:monospace;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .service-tag{
    display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;
    background:#eef7fd;color:#4a6d8c;margin-left:6px;font-weight:600;
  }
  .service-price{
    font-weight:700;color:var(--med-blue);white-space:nowrap;
    font-size:13.5px;margin-left:6px;align-self:center;
  }

  /* Заголовок группы как строка виртуального списка */
  .group-row{
    position:absolute;left:0;right:0;height:34px;
    display:flex;align-items:center;padding:0 18px;
    background:linear-gradient(90deg,#eaf4fb,#fbfdff);
    border-top:1px solid #dceaf5;border-bottom:1px solid #dceaf5;
    font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--med-teal);
  }
  .group-row .sub{color:#678;font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;margin-left:8px}

  /* ============ КОРЗИНА ============ */
  .cart{padding:14px 18px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;overflow:hidden}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;font-weight:600;color:#3a556b}
  .field input{
    padding:10px 12px;border:2px solid #d9e7f2;border-radius:10px;font-size:13.5px;
    outline:none;transition:.2s;background:#fbfdff;font-family:inherit;
  }
  .field input:focus{border-color:var(--med-accent);box-shadow:0 0 0 4px rgba(79,195,247,.15);background:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .cart-items{
    flex:1 1 auto;overflow-y:auto;border:1px dashed #d2e2ee;border-radius:10px;
    padding:6px;background:#fbfdff;min-height:100px;
  }
  .cart-items::-webkit-scrollbar{width:6px}
  .cart-items::-webkit-scrollbar-thumb{background:#c4dcef;border-radius:3px}
  .empty{color:#9bb0c2;text-align:center;padding:26px 10px;font-size:13px}
  .cart-item{
    display:flex;justify-content:space-between;gap:8px;align-items:flex-start;
    padding:8px 9px;border-radius:8px;font-size:12.5px;
    transition:.2s;border:1px solid transparent;
  }
  .cart-item:hover{background:#eef7fd;border-color:#d5e8f5}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .name{line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cart-item .code{font-size:10px;color:#8aa2b8;font-family:monospace;margin-top:1px}
  .cart-item .price{font-weight:700;color:var(--med-blue);white-space:nowrap;font-size:12.5px}
  .cart-item .del{
    border:none;background:transparent;color:#c0cedd;cursor:pointer;font-size:14px;
    padding:0 2px;transition:.2s;flex:0 0 auto;
  }
  .cart-item .del:hover{color:var(--danger);transform:scale(1.2)}

  .totals{
    background:linear-gradient(135deg,#f0f8ff,#e6f4ff);border-radius:12px;padding:12px 15px;
    border:1px solid #d3e8f7;flex:0 0 auto;
  }
  .totals .line{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
  .totals .line.total{
    border-top:2px dashed #b9d3e6;margin-top:6px;padding-top:10px;
    font-size:18px;font-weight:800;color:var(--med-blue-dark);
  }
  .totals .line.discount{color:var(--danger);font-weight:600}

  .btn{
    border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;
    cursor:pointer;transition:.25s;letter-spacing:.3px;font-family:inherit;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--med-teal),#0d8b8b);color:#fff;
    box-shadow:0 6px 16px rgba(18,163,163,.35);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(18,163,163,.45)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-danger{background:#fdecea;color:var(--danger);border:1px solid #f6c8c2}
  .btn-danger:hover{background:var(--danger);color:#fff}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120%);
    background:var(--med-blue-dark);color:#fff;padding:12px 24px;border-radius:30px;
    box-shadow:var(--shadow);font-size:13.5px;transition:.4s cubic-bezier(.2,.8,.3,1);z-index:99;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  .loader{text-align:center;padding:50px 20px;color:#7d95aa;font-size:14px}
  .loader .spin{
    width:36px;height:36px;border:4px solid #d9e7f2;border-top-color:var(--med-teal);
    border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .no-data{padding:50px 20px;text-align:center;color:#9bb0c2;font-size:14px}
</style>
</head>
<body>

<header>
  <h1><span class="cross"></span>Калькулятор медицинских услуг</h1>
  <p>Выберите услуги, сформируйте комплекс и выгрузите расчёт в Excel</p>
</header>

<div class="layout">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <section class="panel">
    <div class="panel-head">
      <div class="left"><span class="dot"></span>Каталог услуг</div>
      <span class="chip" id="totalChip">—</span>
    </div>

    <div class="filters">
      <div class="search-box">
        <span class="icon">🔍</span>
        <input id="search" type="text" placeholder="Поиск по названию или коду услуги..." autocomplete="off">
        <span class="counter" id="searchCounter"></span>
        <button class="clear" id="clearSearch" title="Очистить">✕</button>
      </div>
      <select id="filterGroup"><option value="">Все разделы</option></select>
      <select id="filterSubgroup"><option value="">Все подразделы</option></select>
    </div>

    <div class="meta">
      <span>Найдено: <b id="foundCount">0</b></span>
      <span class="chip teal">Выбрано: <b id="pickedCount">0</b></span>
    </div>

    <div class="vlist-wrap" id="vlistWrap">
      <div class="loader"><div class="spin"></div>Загрузка каталога услуг...</div>
    </div>
  </section>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <section class="panel">
    <div class="panel-head">
      <div class="left"><span class="dot" style="background:var(--med-accent)"></span>Собранный комплекс</div>
    </div>
    <div class="cart">
      <div class="field">
        <label>Название комплекса</label>
        <input id="complexName" type="text" placeholder="Например: Комплекс «Здоровое сердце»">
      </div>

      <div class="field" style="flex:1 1 auto;min-height:0">
        <label>Выбранные услуги</label>
        <div class="cart-items" id="cartItems">
          <div class="empty">Пока ничего не выбрано.<br>Отметьте услуги в каталоге слева.</div>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>Скидка, %</label>
          <input id="discount" type="number" min="0" max="100" step="1" value="0">
        </div>
        <div class="field">
          <label>Позиций</label>
          <input id="positions" type="text" value="0" readonly style="background:#eef7fd;font-weight:700;color:var(--med-blue)">
        </div>
      </div>

      <div class="totals">
        <div class="line"><span>Сумма услуг:</span><span id="sumTotal">0 ₽</span></div>
        <div class="line discount"><span>Скидка:</span><span id="discountValue">0 ₽</span></div>
        <div class="line total"><span>Итого со скидкой:</span><span id="grandTotal">0 ₽</span></div>
      </div>

      <button class="btn btn-primary" id="exportBtn">📥 Выгрузить в Excel</button>
      <button class="btn btn-danger" id="resetBtn">Очистить всё</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Оптимизированный калькулятор для ~5000+ услуг
   - Виртуальный скролл (рендерим только видимые строки)
   - Дебаунс поиска
   - Фильтры по разделам/подразделам
   - Делегирование событий
   ===================================================================== */

const XLSX_FILE = 'price_01.10.26.xlsx';
const ROW_H_SERVICE = 62;   // высота строки услуги (px) — должна совпадать с CSS var --row-h
const ROW_H_GROUP   = 34;   // высота заголовка группы
const BUFFER_ROWS   = 6;    // сколько строк отрисовывать сверх видимой области
const DEBOUNCE_MS   = 180;

const $ = id => document.getElementById(id);

/* ---------- Состояние ---------- */
let allServices = [];              // {code,name,price,group,subgroup, _search}
let servicesByCode = new Map();    // code -> service
let selected = new Map();          // code -> service (порядок добавления сохраняется)
let filteredItems = [];            // массив {type:'group'|'service', ...} — плоский список с заголовками
let itemOffsets = [];              // предрассчитанные Y-координаты для каждого элемента
let totalHeight = 0;

let currentQuery = '';
let currentGroup = '';
let currentSubgroup = '';

let wrapEl, spacerEl;
let rafPending = false;

/* ---------- Утилиты ---------- */
function parsePrice(raw){
  if (raw === null || raw === undefined) return null;
  if (typeof raw === 'number') return raw;
  const s = String(raw).trim();
  if (!s || /по\s*запросу/i.test(s)) return null;
  const cleaned = s.replace(/[^\d.,]/g,'').replace(/\s/g,'');
  let normalized = cleaned;
  if (cleaned.includes(',') && cleaned.includes('.')){
    normalized = cleaned.replace(/\./g,'').replace(',', '.');
  } else if (cleaned.includes(',')){
    normalized = cleaned.replace(',', '.');
  }
  const n = parseFloat(normalized);
  return isNaN(n) ? null : n;
}
function formatMoney(n){
  if (n === null || n === undefined || isNaN(n)) return 'по запросу';
  return n.toLocaleString('ru-RU') + ' ₽';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove('show'), 2400);
}
function debounce(fn, ms){
  let tid;
  return function(...args){
    clearTimeout(tid);
    tid = setTimeout(()=>fn.apply(this,args), ms);
  };
}

/* ---------- Загрузка xlsx ---------- */
async function loadPrices(){
  try{
    const resp = await fetch(XLSX_FILE + '?v=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

    // Заголовок
    let headerRow = 0;
    for (let i=0;i<Math.min(rows.length,5);i++){
      const r = rows[i].map(x=>String(x).toLowerCase());
      if (r.some(x=>x.includes('код')) && r.some(x=>x.includes('наимен'))){
        headerRow = i; break;
      }
    }
    const header = rows[headerRow].map(x=>String(x).toLowerCase().trim());
    let colCode = header.findIndex(h=>h.includes('код'));
    let colName = header.findIndex(h=>h.includes('наимен'));
    let colPrice = header.findIndex(h=>h.includes('стоим') || h.includes('цена'));
    if (colCode < 0) colCode = 0;
    if (colName < 0) colName = 1;
    if (colPrice < 0) colPrice = 2;

    const subMarkers = ['стандартные','консультации','телеконсультации','прочие','помощь на дому',
                        'манипуляции','обследования','оперативные','анестезия','вакцинация',
                        'компоненты крови','гемотрансфузия','лечение с использованием',
                        'комплексы услуг','радиоволновое удаление','picc'];

    let lastGroup = 'Прочее';
    let lastSubgroup = '';
    const list = [];

    for (let i = headerRow+1; i < rows.length; i++){
      const row = rows[i];
      if (!row) continue;
      const code = String(row[colCode] ?? '').trim();
      const name = String(row[colName] ?? '').trim();
      const rawPrice = row[colPrice];

      if (!code && name && (rawPrice === '' || rawPrice === undefined)){
        const lower = name.toLowerCase();
        const isSub = subMarkers.some(m => lower.startsWith(m));
        if (isSub) lastSubgroup = name;
        else { lastGroup = name; lastSubgroup = ''; }
        continue;
      }

      if (code && name){
        const price = parsePrice(rawPrice);
        const svc = {
          code, name, price,
          group: lastGroup,
          subgroup: lastSubgroup,
          _search: (code + ' ' + name).toLowerCase()
        };
        list.push(svc);
      }
    }

    allServices = list;
    servicesByCode.clear();
    for (const s of list) servicesByCode.set(s.code, s);

    $('totalChip').textContent = 'Всего: ' + list.length.toLocaleString('ru-RU') + ' услуг';

    buildFilterOptions();
    applyFiltersAndRender();
    updateCart();

  }catch(err){
    console.error(err);
    $('vlistWrap').innerHTML =
      `<div class="no-data" style="color:#c0392b">
        ⚠ Не удалось загрузить файл <b>${XLSX_FILE}</b>.<br><br>
        Убедитесь, что он лежит рядом с index.html и открываете сайт через сервер (не file://).
      </div>`;
  }
}

/* ---------- Построение выпадающих фильтров ---------- */
function buildFilterOptions(){
  const groups = new Set();
  for (const s of allServices) groups.add(s.group);

  const gSel = $('filterGroup');
  // сортируем: русский алфавит
  const sortedGroups = Array.from(groups).sort((a,b)=>a.localeCompare(b,'ru'));
  gSel.innerHTML = '<option value="">Все разделы</option>' +
    sortedGroups.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
}

function rebuildSubgroups(){
  const subSel = $('filterSubgroup');
  const subs = new Set();
  for (const s of allServices){
    if (currentGroup && s.group !== currentGroup) continue;
    if (s.subgroup) subs.add(s.subgroup);
  }
  const sorted = Array.from(subs).sort((a,b)=>a.localeCompare(b,'ru'));
  const prev = currentSubgroup;
  subSel.innerHTML = '<option value="">Все подразделы</option>' +
    sorted.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
  // восстановить выбор, если подраздел ещё существует
  if (prev && sorted.includes(prev)) subSel.value = prev;
  else { subSel.value = ''; currentSubgroup = ''; }
}

/* ---------- Фильтрация + подготовка плоского списка ---------- */
function applyFiltersAndRender(){
  const q = currentQuery.trim().toLowerCase();

  let items = allServices;
  if (currentGroup)    items = items.filter(s => s.group === currentGroup);
  if (currentSubgroup) items = items.filter(s => s.subgroup === currentSubgroup);
  if (q)               items = items.filter(s => s._search.includes(q));

  $('foundCount').textContent = items.length.toLocaleString('ru-RU');
  $('searchCounter').textContent = q ? items.length.toLocaleString('ru-RU') : '';

  // Формируем плоский список с заголовками групп.
  // Заголовок группы вставляем, когда group или subgroup меняется.
  // Если группа/подгруппа одна — заголовки не нужны (или нужен один).
  const flat = [];
  let lastGroupSeen = null, lastSubSeen = null;
  const manyGroups = new Set(items.map(s=>s.group)).size > 1;

  for (const s of items){
    if (manyGroups){
      if (s.group !== lastGroupSeen){
        flat.push({type:'group', group:s.group, subgroup:s.subgroup || ''});
        lastGroupSeen = s.group;
        lastSubSeen = s.subgroup || '';
      } else if ((s.subgroup||'') !== lastSubSeen){
        flat.push({type:'subgroup', group:s.group, subgroup:s.subgroup || ''});
        lastSubSeen = s.subgroup || '';
      }
    }
    flat.push({type:'service', svc:s});
  }

  filteredItems = flat;

  // Пересчитываем смещения и общую высоту
  itemOffsets = new Array(flat.length);
  let y = 0;
  for (let i=0;i<flat.length;i++){
    itemOffsets[i] = y;
    y += flat[i].type === 'service' ? ROW_H_SERVICE : ROW_H_GROUP;
  }
  totalHeight = y;

  // Обновляем DOM-структуру виртуального списка
  const wrap = wrapEl;
  const scrollTop = wrap.scrollTop;
  const oldSpacer = spacerEl;
  const spacer = document.createElement('div');
  spacer.className = 'vlist-spacer';
  spacer.style.height = totalHeight + 'px';
  if (oldSpacer) wrap.replaceChild(spacer, oldSpacer);
  else { wrap.innerHTML = ''; wrap.appendChild(spacer); }
  spacerEl = spacer;

  if (flat.length === 0){
    spacer.innerHTML = '<div class="no-data">По вашему запросу ничего не найдено.</div>';
    spacer.style.height = 'auto';
    return;
  }

  renderVisible();
  // Восстанавливаем скролл, если был (например, при изменении фильтра — оставляем вверху)
  if (scrollTop > totalHeight) wrap.scrollTop = 0;
}

/* ---------- Виртуальный скролл ---------- */
function renderVisible(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    const wrap = wrapEl;
    if (!wrap || !spacerEl) return;

    const scrollTop = wrap.scrollTop;
    const viewH = wrap.clientHeight;

    // Бинарный поиск первого видимого элемента
    let lo = 0, hi = itemOffsets.length - 1, startIdx = 0;
    while (lo <= hi){
      const mid = (lo+hi) >> 1;
      const top = itemOffsets[mid];
      const h = filteredItems[mid].type === 'service' ? ROW_H_SERVICE : ROW_H_GROUP;
      if (top + h >= scrollTop) { startIdx = mid; hi = mid - 1; }
      else lo = mid + 1;
    }
    // немного вверх для буфера
    startIdx = Math.max(0, startIdx - BUFFER_ROWS);

    // Ищем последний видимый
    let endIdx = startIdx;
    while (endIdx < itemOffsets.length && itemOffsets[endIdx] < scrollTop + viewH){
      endIdx++;
    }
    endIdx = Math.min(itemOffsets.length - 1, endIdx + BUFFER_ROWS);

    // Строим HTML
    const parts = [];
    for (let i = startIdx; i <= endIdx; i++){
      const it = filteredItems[i];
      const top = itemOffsets[i];
      if (it.type === 'service'){
        const s = it.svc;
        const isSel = selected.has(s.code);
        parts.push(
          `<div class="service${isSel?' selected':''}" data-code="${escapeHtml(s.code)}" data-idx="${i}" style="top:${top}px">` +
            `<input type="checkbox" ${isSel?'checked':''} tabindex="-1">` +
            `<div class="service-body">` +
              `<div class="service-name">${escapeHtml(s.name)}</div>` +
              `<div class="service-code">${escapeHtml(s.code)}` +
                (s.subgroup && currentGroup ? `<span class="service-tag">${escapeHtml(s.subgroup)}</span>` : '') +
              `</div>` +
            `</div>` +
            `<div class="service-price">${formatMoney(s.price)}</div>` +
          `</div>`
        );
      } else {
        const label = it.type === 'group' ? it.group : it.subgroup;
        const cls = it.type === 'group' ? 'group-row' : 'group-row';
        const subHtml = (it.type === 'group' && it.subgroup)
          ? `<span class="sub">${escapeHtml(it.subgroup)}</span>` : '';
        parts.push(`<div class="${cls}" style="top:${top}px;${it.type==='subgroup'?'background:linear-gradient(90deg,#f3f9fe,#fbfdff);font-size:11px;color:#678;border-top:none;':''}">${escapeHtml(label)}${subHtml}</div>`);
      }
    }
    spacerEl.innerHTML = parts.join('');
  });
}

/* ---------- Обновление одной строки после toggle (без полного рендера) ---------- */
function refreshRowVisual(code){
  if (!spacerEl) return;
  const row = spacerEl.querySelector(`.service[data-code="${CSS.escape(code)}"]`);
  if (!row) return;
  const isSel = selected.has(code);
  row.classList.toggle('selected', isSel);
  const cb = row.querySelector('input[type=checkbox]');
  if (cb) cb.checked = isSel;
}

/* ---------- Обработчики виртуального списка (делегирование) ---------- */
function attachListHandlers(){
  wrapEl.addEventListener('scroll', renderVisible, {passive:true});
  wrapEl.addEventListener('click', e => {
    const row = e.target.closest('.service');
    if (!row) return;
    const code = row.dataset.code;
    if (!code) return;
    const svc = servicesByCode.get(code);
    if (!svc) return;
    if (selected.has(code)) selected.delete(code);
    else selected.set(code, svc);
    refreshRowVisual(code);
    updateCart();
  });
}

/* ---------- Корзина и итоги ---------- */
function updateCart(){
  const box = $('cartItems');
  if (selected.size === 0){
    box.innerHTML = '<div class="empty">Пока ничего не выбрано.<br>Отметьте услуги в каталоге слева.</div>';
  } else {
    const parts = [];
    for (const [code, s] of selected){
      parts.push(
        `<div class="cart-item" data-code="${escapeHtml(code)}">` +
          `<div class="info">` +
            `<div class="name">${escapeHtml(s.name)}</div>` +
            `<div class="code">${escapeHtml(s.code)}</div>` +
          `</div>` +
          `<div class="price">${formatMoney(s.price)}</div>` +
          `<button class="del" title="Удалить">✕</button>` +
        `</div>`
      );
    }
    box.innerHTML = parts.join('');
  }

  $('pickedCount').textContent = selected.size;
  $('positions').value = selected.size;

  let sum = 0, hasRequest = false;
  for (const s of selected.values()){
    if (s.price === null) hasRequest = true;
    else sum += s.price;
  }
  const discountPct = Math.min(100, Math.max(0, parseFloat($('discount').value) || 0));
  const discountVal = sum * discountPct / 100;
  const grand = sum - discountVal;

  $('sumTotal').textContent = formatMoney(sum) + (hasRequest ? ' + по запросу' : '');
  $('discountValue').textContent = `${discountPct}% (${formatMoney(discountVal)})`;
  $('grandTotal').textContent = formatMoney(grand) + (hasRequest ? ' + по запросу' : '');
}

/* ---------- Экспорт в Excel ---------- */
function exportToExcel(){
  if (selected.size === 0){ showToast('Сначала выберите хотя бы одну услугу'); return; }
  const complexName = $('complexName').value.trim() || 'Комплекс медицинских услуг';
  const discountPct = Math.min(100, Math.max(0, parseFloat($('discount').value) || 0));

  let sum = 0, hasRequest = false;
  const aoa = [];
  aoa.push([complexName]);
  aoa.push([]);
  aoa.push(['Код', 'Наименование услуги', 'Стоимость, руб.']);

  for (const s of selected.values()){
    aoa.push([s.code, s.name, s.price === null ? 'по запросу' : s.price]);
    if (s.price === null) hasRequest = true;
    else sum += s.price;
  }
  const discountVal = sum * discountPct / 100;
  const grand = sum - discountVal;

  aoa.push([]);
  aoa.push(['', 'Сумма услуг', sum]);
  aoa.push(['', `Скидка ${discountPct}%`, -discountVal]);
  aoa.push(['', 'Стоимость с учетом скидки', grand]);
  if (hasRequest) aoa.push(['', 'Примечание', 'Часть услуг — по запросу, уточняйте стоимость']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:18},{wch:80},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Расчёт');

  const safeName = complexName.replace(/[\\/:*?"<>|]/g,'_').slice(0,50);
  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Расчёт_${safeName}_${date}.xlsx`);
  showToast('Файл Excel сформирован');
}

/* ---------- Инициализация ---------- */
document.addEventListener('DOMContentLoaded', ()=>{
  wrapEl = $('vlistWrap');
  spacerEl = null;

  attachListHandlers();

  // Поиск с дебаунсом
  const onSearch = debounce(()=>{
    currentQuery = $('search').value;
    applyFiltersAndRender();
  }, DEBOUNCE_MS);
  $('search').addEventListener('input', onSearch);

  $('clearSearch').addEventListener('click', ()=>{
    $('search').value = '';
    currentQuery = '';
    applyFiltersAndRender();
    $('search').focus();
  });

  $('filterGroup').addEventListener('change', e=>{
    currentGroup = e.target.value;
    currentSubgroup = '';
    rebuildSubgroups();
    applyFiltersAndRender();
    wrapEl.scrollTop = 0;
  });
  $('filterSubgroup').addEventListener('change', e=>{
    currentSubgroup = e.target.value;
    applyFiltersAndRender();
    wrapEl.scrollTop = 0;
  });

  $('discount').addEventListener('input', updateCart);
  $('complexName').addEventListener('input', updateCart);
  $('exportBtn').addEventListener('click', exportToExcel);

  // Делегирование для корзины
  $('cartItems').addEventListener('click', e=>{
    const del = e.target.closest('.del');
    if (!del) return;
    const code = del.closest('.cart-item').dataset.code;
    selected.delete(code);
    refreshRowVisual(code);
    updateCart();
  });

  $('resetBtn').addEventListener('click', ()=>{
    if (selected.size && !confirm('Удалить все выбранные услуги?')) return;
    selected.clear();
    $('complexName').value = '';
    $('discount').value = 0;
    updateCart();
    // обновим только видимые строки
    if (spacerEl){
      spacerEl.querySelectorAll('.service').forEach(row=>{
        row.classList.remove('selected');
        const cb = row.querySelector('input[type=checkbox]');
        if (cb) cb.checked = false;
      });
    }
    showToast('Список очищен');
  });

  // При изменении размера окна — пересчёт видимой области
  window.addEventListener('resize', debounce(renderVisible, 100));

  loadPrices();
});
</script>
